<svg xmlns="http://www.w3.org/2000/svg" width="846" height="500" viewBox="0 0 846 500" role="img">
  <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#1f2328">Supplier DSS — titik ideal itu tidak pernah ada</text>
  <line x1="70" y1="86" x2="70" y2="318" stroke="#59636e" stroke-width="1"/>
  <line x1="70" y1="318" x2="302" y2="318" stroke="#59636e" stroke-width="1"/>
  <text x="62" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#59636e">kualitas</text>
  <text x="70" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#59636e">harga, dibalik  →</text>
  <circle cx="118" cy="252" r="6" fill="#1f2328"/>
  <text x="131" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#1f2328">A</text>
  <circle cx="180" cy="190" r="6" fill="#1f2328"/>
  <text x="193" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#1f2328">B</text>
  <circle cx="236" cy="268" r="6" fill="#1f2328"/>
  <text x="249" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#1f2328">C</text>
  <circle cx="276" cy="124" r="9" fill="none" stroke="#8a5a00" stroke-width="2.5"/>
  <text x="292" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#8a5a00">A+</text>
  <circle cx="104" cy="296" r="9" fill="none" stroke="#8a5a00" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="120" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#8a5a00">A−</text>
  <path d="M180 190 L270 130" stroke="#8a5a00" stroke-width="1.5" fill="none"/>
  <path d="M180 190 L110 289" stroke="#8a5a00" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <text x="232" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#8a5a00">S+</text>
  <text x="148" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#8a5a00">S−</text>
  <text x="400" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1f2328">A+ menggabungkan nilai terbaik</text>
  <text x="400" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1f2328">dari setiap kriteria, A− nilai</text>
  <text x="400" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1f2328">terburuknya. Keduanya komposit</text>
  <text x="400" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1f2328">khayalan: tidak ada pemasok</text>
  <text x="400" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#1f2328">yang berada di titik itu.</text>
  <rect x="400" y="282" width="390" height="90" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
  <text x="418" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#8a5a00">C = S− / (S+ + S−)</text>
  <text x="418" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#59636e">dekat ideal, jauh dari terburuk</text>
  <line x1="0" y1="406" x2="846" y2="406" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="0" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e">Buang satu kriteria dan peringkatnya ikut berubah, karena A+ dan A−</text>
  <text x="0" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e">dihitung ulang dari kolom yang tersisa.</text>
</svg>
