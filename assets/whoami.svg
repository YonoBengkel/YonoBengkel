<svg xmlns="http://www.w3.org/2000/svg" width="846" height="186" viewBox="0 0 846 186" role="img">
  <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#1f2328">I like the whole chain: raw data, pipelines, statistics,</text>
  <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#1f2328">models, and the dashboard someone decides from.</text>
  <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e">What draws me is the reasoning under the tooling — what a</text>
  <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#59636e">method assumes, and where that assumption breaks.</text>
</svg>
