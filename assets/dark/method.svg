<svg xmlns="http://www.w3.org/2000/svg" width="846" height="466" viewBox="0 0 846 466" role="img">
  <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#e6edf3">Medallion — kenapa join biasa memberi angka yang salah</text>
  <rect x="0" y="60" width="236" height="92" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="18" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#d9a441" letter-spacing="1">BRONZE</text>
  <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9198a1">salinan mentah</text>
  <rect x="290" y="60" width="236" height="92" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="308" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#d9a441" letter-spacing="1">SILVER</text>
  <text x="308" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9198a1">dibersihkan, disatukan</text>
  <rect x="580" y="60" width="236" height="92" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="598" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#d9a441" letter-spacing="1">GOLD</text>
  <text x="598" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9198a1">siap dibaca</text>
  <line x1="246" y1="106" x2="275" y2="106" stroke="#9198a1" stroke-width="1.5"/>
  <path d="M282 106 L273 101 L273 111 Z" fill="#9198a1"/>
  <line x1="536" y1="106" x2="565" y2="106" stroke="#9198a1" stroke-width="1.5"/>
