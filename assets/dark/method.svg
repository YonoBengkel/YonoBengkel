  <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#e6edf3">Harga pokok sebuah produk berubah dari waktu ke waktu.</text>
  <text x="0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#e6edf3">Join pada product_id saja memakai harga pokok terbaru untuk</text>
  <text x="0" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#e6edf3">transaksi tahun lalu — margin historis jadi keliru.</text>
  <rect x="0" y="324" width="846" height="118" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="22" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#d9a441">Perbaikan: as-of join</text>
  <text x="22" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9198a1">ambil baris harga yang berlaku pada tanggal transaksi, bukan</text>
  <text x="22" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9198a1">baris harga yang berlaku hari ini.</text>
