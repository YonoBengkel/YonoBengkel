<svg xmlns="http://www.w3.org/2000/svg" width="846" height="390" viewBox="0 0 846 390" role="img">
  <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6edf3">Mahasiswa Sains Data Terapan, Politeknik Elektronika Negeri Surabaya.</text>
  <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6edf3">Magang sebagai AI Engineer di Ideola sejak Juli 2026.</text>
  <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6edf3">Saya lebih tertarik pada kenapa sebuah metode bekerja daripada</text>
  <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6edf3">pada tool yang memakainya. Yang saya kejar: tahu asumsi apa yang</text>
  <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#e6edf3">sedang dipinjam, dan kapan asumsi itu patah.</text>
  <text x="0" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#9198a1">Dua bagian berikutnya bukan daftar kemampuan. Keduanya satu</text>
  <text x="0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#9198a1">keputusan nyata dari dua proyek, lengkap dengan alasannya.</text>
</svg>
